[project]
name = "gpu-scheduler"
version = "0.1.0"
description = "Fair-share GPU cluster scheduler with EASY backfill"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic-settings>=2.3.3",
    "loguru>=0.7.2",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "ruff>=0.4.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "PL"]
# PLR2004: fixed GPU counts and HTTP status codes read clearer as literals in tests
ignore = ["PLR2004"]
