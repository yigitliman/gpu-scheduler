name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest-cov

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t gpu-scheduler:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8000:8000 gpu-scheduler:${{ github.sha }}
          sleep 10
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/metrics > /dev/null
          docker stop smoke

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag gpu-scheduler:${{ github.sha }} ghcr.io/yigitliman/gpu-scheduler:latest
          docker tag gpu-scheduler:${{ github.sha }} ghcr.io/yigitliman/gpu-scheduler:${{ github.sha }}
          docker push ghcr.io/yigitliman/gpu-scheduler:latest
          docker push ghcr.io/yigitliman/gpu-scheduler:${{ github.sha }}
